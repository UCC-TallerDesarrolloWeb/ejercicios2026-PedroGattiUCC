<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catálogo de productos</title>
        <link rel="stylesheet" href="catalogo.css" type="text/css">
        <script type="text/javascript" src="tienda.js"></script>
    </head>
    <body class="grid-container" onload="cargarproducto()">
        <header class="item1">
            Catálogo de productos
        </header>

        <nav class="item2">
            <a href="productos.html" class="activo">Catálogo de productos</a>
            <a href="carrito.html">Carrito de compras<span id="contador-carrito"></span></a>
        </nav>

        <aside class="item3">
            <form name="filtrer" onsubmit="event.preventDefault();">
                <fieldset>
                    <legend>Búsqueda</legend>
                    <label for="search">Buscar:</label>
                    <input type="text" name="search" id="search" oninput="filtrarproductos()">
                </fieldset>

                <fieldset>
                    <legend>Precios:</legend>
                    <p>
                        <label for="minimo">Mínimo:</label>
                        <input type="number" id="minimo" name="precio-min" min="0" oninput="filtrarproductos()">
                    </p>
                    <p>
                        <label for="maximo">Máximo:</label> 
                        <input type="number" id="maximo" name="precio-max" min="0" oninput="filtrarproductos()">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Tipo de productos:</legend>
                    <p>
                        <input type="checkbox" id="protectores" name="tipo" value="protectores" onchange="filtrarproductos()">
                        <label for="protectores">Protectores</label>
                    </p>
                    <p>
                        <input type="checkbox" name="tipo" id="entrenamiento" value="entrenamiento" onchange="filtrarproductos()">
                        <label for="entrenamiento">Entrenamiento</label>
                    </p>
                    <p>
                        <input type="checkbox" name="tipo" id="dobok" value="dobok" onchange="filtrarproductos()">
                        <label for="dobok">Dobok</label>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Marca:</legend>
                    <select id="marca" onchange="filtrarproductos()">
                        <option value="">Todas</option>
                        <option value="Gran Marc">Gran Marc</option>
                        <option value="Daedo">Daedo</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Ordenar:</legend>
                    <select id="orden" onchange="filtrarproductos()">
                        <option value="">Por defecto</option>
                        <option value="precio-asc">Precio: Menor a Mayor</option>
                        <option value="precio-desc">Precio: Mayor a Menor</option>
                        <option value="nombre-asc">Nombre: A - Z</option>
                        <option value="nombre-desc">Nombre: Z - A</option>
                    </select>
                </fieldset>
            </form>
        </aside>

        <dialog id="modal">
            <h2>Detalles del producto</h2>
            <h3 id="titulo-producto"></h3>
            <p id="descripcion-producto"></p>
            <button type="button" onclick="cerrarmodal()">Cerrar</button>
        </dialog>

        <main class="item4" id="mostrar-catalogo">
        </main>

        <footer class="item5">
            Contacto
        </footer>
    </body>
</html>
